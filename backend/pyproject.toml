[project]
name = "texa"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "psycopg[binary,pool]>=3.2",
  "pydantic>=2.9",
  "pyyaml>=6",
  "google-genai>=1.30",
  "anthropic>=0.70",
  "openai>=1.100",
  "cryptography>=43",
  "jsonschema>=4.23",
]

[project.scripts]
texa = "texa.cli:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
