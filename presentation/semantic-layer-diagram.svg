<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="560" viewBox="0 0 1800 560" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f8a7e"/>
    </marker>
    <g id="card">
      <rect x="0" y="40" width="500" height="480" rx="18" fill="#fff" stroke="#d5dde8" stroke-width="2"/>
      <rect x="28" y="160" width="444" height="330" rx="12" fill="#eef2f7"/>
      <circle cx="56" cy="100" r="28" fill="#1f8a7e"/>
      <text x="52" y="195" font-size="16" font-weight="700" fill="#1f8a7e" letter-spacing="2">VÍ DỤ</text>
    </g>
  </defs>
  <rect width="1800" height="560" fill="#fff"/>

  <!-- arrows -->
  <line x1="566" y1="280" x2="630" y2="280" stroke="#1f8a7e" stroke-width="5" marker-end="url(#ah)"/>
  <line x1="1166" y1="280" x2="1230" y2="280" stroke="#1f8a7e" stroke-width="5" marker-end="url(#ah)"/>

  <!-- ① Định nghĩa sẵn -->
  <g transform="translate(50,0)">
    <use href="#card"/>
    <text x="56" y="110" font-size="28" font-weight="700" fill="#fff" text-anchor="middle">1</text>
    <text x="100" y="96" font-size="30" font-weight="700" fill="#14284b">Định nghĩa sẵn</text>
    <text x="100" y="128" font-size="22" fill="#5b6b80">một lần, dùng cho cả công ty</text>
    <text x="52" y="245" font-size="28" font-weight="700" fill="#1f8a7e">Doanh thu</text>
    <text x="52" y="283" font-size="22" fill="#14284b">= tổng tiền các đơn đã giao</text>
    <text x="52" y="315" font-size="22" fill="#5b6b80">(không tính đơn hủy)</text>
    <line x1="52" y1="345" x2="448" y2="345" stroke="#cfd8e3" stroke-width="1.5"/>
    <text x="52" y="382" font-size="20" fill="#5b6b80">Có thể xem theo:</text>
    <g font-size="20" fill="#14284b" text-anchor="middle">
      <rect x="52" y="405" width="90" height="40" rx="20" fill="#fff" stroke="#b9c6d6"/>
      <text x="97" y="432">tháng</text>
      <rect x="154" y="405" width="130" height="40" rx="20" fill="#fff" stroke="#b9c6d6"/>
      <text x="219" y="432">danh mục</text>
      <rect x="296" y="405" width="115" height="40" rx="20" fill="#fff" stroke="#b9c6d6"/>
      <text x="353.5" y="432">khu vực</text>
    </g>
  </g>

  <!-- ② Người dùng hỏi -->
  <g transform="translate(650,0)">
    <use href="#card"/>
    <text x="56" y="110" font-size="28" font-weight="700" fill="#fff" text-anchor="middle">2</text>
    <text x="100" y="96" font-size="30" font-weight="700" fill="#14284b">Người dùng hỏi</text>
    <text x="100" y="128" font-size="22" fill="#5b6b80">chỉ cần nói muốn xem gì</text>
    <rect x="52" y="215" width="396" height="56" rx="28" fill="#fff" stroke="#b9c6d6"/>
    <text x="250" y="250" font-size="20" font-style="italic" fill="#14284b" text-anchor="middle">“Doanh thu tháng 3 theo danh mục?”</text>
    <text x="52" y="315" font-size="18" fill="#5b6b80">Hệ thống hiểu thành:</text>
    <g font-size="20">
      <text x="52" y="358" fill="#5b6b80">Chỉ số</text>
      <text x="160" y="358" fill="#1f8a7e">→</text>
      <text x="196" y="358" font-size="22" font-weight="700" fill="#14284b">Doanh thu</text>
      <line x1="52" y1="377" x2="448" y2="377" stroke="#cfd8e3" stroke-width="1.5"/>
      <text x="52" y="408" fill="#5b6b80">Chia theo</text>
      <text x="160" y="408" fill="#1f8a7e">→</text>
      <text x="196" y="408" font-size="22" font-weight="700" fill="#14284b">danh mục</text>
      <line x1="52" y1="427" x2="448" y2="427" stroke="#cfd8e3" stroke-width="1.5"/>
      <text x="52" y="458" fill="#5b6b80">Thời gian</text>
      <text x="160" y="458" fill="#1f8a7e">→</text>
      <text x="196" y="458" font-size="22" font-weight="700" fill="#14284b">tháng 3</text>
    </g>
  </g>

  <!-- ③ Hệ thống tự tính -->
  <g transform="translate(1250,0)">
    <use href="#card"/>
    <text x="56" y="110" font-size="28" font-weight="700" fill="#fff" text-anchor="middle">3</text>
    <text x="100" y="96" font-size="30" font-weight="700" fill="#14284b">Hệ thống tự tính</text>
    <text x="100" y="128" font-size="22" fill="#5b6b80">theo đúng định nghĩa ở bước 1</text>
    <text x="52" y="232" font-size="18" fill="#5b6b80">Câu lệnh SQL được tạo tự động:</text>
    <rect x="52" y="248" width="396" height="150" rx="8" fill="#14284b"/>
    <g font-family="Menlo, Monaco, monospace" font-size="16" fill="#e6edf5">
      <text x="70" y="276">SELECT danh_muc, SUM(tong_tien)</text>
      <text x="70" y="298">FROM don_hang</text>
      <text x="70" y="320">WHERE trang_thai = 'đã giao'</text>
      <text x="70" y="342">  AND thang = 3</text>
      <text x="70" y="364">GROUP BY danh_muc</text>
    </g>
    <rect x="52" y="418" width="396" height="56" rx="10" fill="#e3f3f0" stroke="#1f8a7e" stroke-width="1.5"/>
    <circle cx="84" cy="446" r="14" fill="#1f8a7e"/>
    <path d="M77,446 l5,5 l9,-10" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="110" y="453" font-size="21" font-weight="700" fill="#14284b">Ai hỏi cũng cùng một cách tính</text>
  </g>
</svg>
