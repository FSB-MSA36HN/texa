<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="600" viewBox="0 0 1500 600" font-family="Arial, sans-serif"><rect width="1500" height="600" fill="#f7f9fc"/><text x="750" y="60" text-anchor="middle" font-size="34" font-weight="700" fill="#14284b">Semantic layer: định nghĩa trước khi truy vấn</text><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f8a7e"/></marker></defs><g fill="#fff" stroke="#cbd5e1" stroke-width="2"><rect x="80" y="155" width="350" height="280" rx="18"/><rect x="575" y="155" width="350" height="280" rx="18"/><rect x="1070" y="155" width="350" height="280" rx="18"/></g><g fill="none" stroke="#1f8a7e" stroke-width="4" marker-end="url(#a)"><path d="M430 295h135"/><path d="M925 295h135"/></g><g text-anchor="middle" fill="#14284b"><text x="255" y="210" font-size="27" font-weight="700">Catalog</text><text x="255" y="260" font-size="20">8 metric · dimensions</text><text x="255" y="300" font-size="18">event roles · synonyms</text><text x="255" y="340" font-size="18">source-specific support</text><text x="750" y="210" font-size="27" font-weight="700">QuerySpec</text><text x="750" y="260" font-size="20">metric · source · time</text><text x="750" y="300" font-size="18">filters · breakdown</text><text x="750" y="340" font-size="18">validator checks scope</text><text x="1245" y="210" font-size="27" font-weight="700">Compiler</text><text x="1245" y="260" font-size="20">deterministic SQL</text><text x="1245" y="300" font-size="18">parameters + read role</text><text x="1245" y="340" font-size="18">facts with provenance</text></g><text x="750" y="510" text-anchor="middle" font-size="19" fill="#526176">Hợp lệ về cấu trúc không tự chứng minh đã hiểu đúng nghiệp vụ.</text></svg>
