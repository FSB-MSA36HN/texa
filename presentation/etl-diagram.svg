<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="620" viewBox="0 0 1800 620" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f8a7e"/>
    </marker>
    <g id="card">
      <rect x="0" y="30" width="375" height="330" rx="18" fill="#fff" stroke="#d5dde8" stroke-width="2"/>
      <rect x="22" y="135" width="331" height="205" rx="12" fill="#eef2f7"/>
      <circle cx="46" cy="82" r="24" fill="#1f8a7e"/>
    </g>
    <circle id="dot" r="4" fill="#1f8a7e"/>
  </defs>
  <rect width="1800" height="620" fill="#fff"/>

  <!-- arrows, top row -->
  <g stroke="#1f8a7e" stroke-width="5" marker-end="url(#ah)">
    <line x1="434" y1="195" x2="484" y2="195"/>
    <line x1="875" y1="195" x2="925" y2="195"/>
    <line x1="1316" y1="195" x2="1366" y2="195"/>
    <polyline points="1561,368 1561,392 312,392 312,412" fill="none"/>
    <line x1="581" y1="505" x2="631" y2="505"/>
    <line x1="1169" y1="505" x2="1219" y2="505"/>
  </g>

  <g font-size="19" fill="#14284b">
    <!-- 1 -->
    <g transform="translate(51,0)">
      <use href="#card"/>
      <text x="46" y="91" font-size="24" font-weight="700" fill="#fff" text-anchor="middle">1</text>
      <text x="84" y="80" font-size="26" font-weight="700">Dữ liệu gốc</text>
      <text x="84" y="108" font-size="18" font-style="italic" fill="#5b6b80">CSV nguồn</text>
      <text x="40" y="172" font-size="20" font-weight="700" fill="#1f8a7e">Cosmetics</text>
      <text x="40" y="198">1 file nhật ký hành vi</text>
      <text x="40" y="242" font-size="20" font-weight="700" fill="#1f8a7e">Olist</text>
      <text x="40" y="268">8 file: đơn hàng, sản phẩm,</text>
      <text x="40" y="294">thanh toán, đánh giá…</text>
    </g>
    <!-- 2 -->
    <g transform="translate(492,0)">
      <use href="#card"/>
      <text x="46" y="91" font-size="24" font-weight="700" fill="#fff" text-anchor="middle">2</text>
      <text x="84" y="80" font-size="26" font-weight="700">Lưu nguyên bản</text>
      <text x="84" y="108" font-size="18" font-style="italic" fill="#5b6b80">Raw</text>
      <use href="#dot" x="40" y="169"/><text x="54" y="175">Giữ nguyên, không sửa gì</text>
      <use href="#dot" x="40" y="209"/><text x="54" y="215">Dùng để đối chiếu khi</text>
      <text x="54" y="241">nghi ngờ số liệu</text>
    </g>
    <!-- 3 -->
    <g transform="translate(933,0)">
      <use href="#card"/>
      <text x="46" y="91" font-size="24" font-weight="700" fill="#fff" text-anchor="middle">3</text>
      <text x="84" y="80" font-size="26" font-weight="700">Làm sạch</text>
      <text x="84" y="108" font-size="18" font-style="italic" fill="#5b6b80">Staging</text>
      <use href="#dot" x="40" y="169"/><text x="54" y="175">Chuẩn kiểu: ngày, số, tiền</text>
      <use href="#dot" x="40" y="209"/><text x="54" y="215">Bỏ bản ghi trùng</text>
      <text x="54" y="241" fill="#5b6b80">(chỉ khi có căn cứ)</text>
      <use href="#dot" x="40" y="275"/><text x="54" y="281">Ghi lại dòng lỗi,</text>
      <text x="54" y="307">không âm thầm xóa</text>
    </g>
    <!-- 4 -->
    <g transform="translate(1374,0)">
      <use href="#card"/>
      <text x="46" y="91" font-size="24" font-weight="700" fill="#fff" text-anchor="middle">4</text>
      <text x="84" y="80" font-size="26" font-weight="700">Gộp về một bảng</text>
      <text x="84" y="108" font-size="18" font-style="italic" fill="#5b6b80">Event mart thống nhất</text>
      <use href="#dot" x="40" y="169"/><text x="54" y="175">Một khuôn chung cho 2 nguồn</text>
      <use href="#dot" x="40" y="209"/><text x="54" y="215">Mỗi dòng ghi rõ: nguồn, thời</text>
      <text x="54" y="241">gian, khách, sản phẩm, giá</text>
      <use href="#dot" x="40" y="275"/><text x="54" y="281">Chống đếm trùng</text>
      <text x="54" y="307">trước khi tính chỉ số</text>
    </g>

    <!-- bottom row -->
    <g transform="translate(51,420)">
      <rect width="522" height="170" rx="16" fill="#fff" stroke="#d5dde8" stroke-width="2"/>
      <text x="28" y="40" font-size="24" font-weight="700">Kiểm tra chất lượng</text>
      <text x="28" y="66" font-size="17" font-style="italic" fill="#5b6b80">quality checks</text>
      <use href="#dot" x="34" y="94"/><text x="48" y="100">Tổng số khớp với bản gốc</text>
      <use href="#dot" x="34" y="122"/><text x="48" y="128">Không trùng, không thiếu khóa</text>
      <use href="#dot" x="34" y="150"/><text x="48" y="156">Ngày tháng hợp lý</text>
    </g>
    <g transform="translate(639,420)">
      <rect width="522" height="170" rx="16" fill="#fff" stroke="#d5dde8" stroke-width="2"/>
      <text x="28" y="40" font-size="24" font-weight="700">Phiếu thông tin cho TEXA</text>
      <text x="28" y="66" font-size="17" font-style="italic" fill="#5b6b80">metadata</text>
      <use href="#dot" x="34" y="94"/><text x="48" y="100">Dữ liệu từ ngày nào đến ngày nào</text>
      <use href="#dot" x="34" y="122"/><text x="48" y="128">Có sự kiện, cột nào; thiếu bao nhiêu</text>
      <use href="#dot" x="34" y="150"/><text x="48" y="156">Tiền tệ gì</text>
    </g>
    <g transform="translate(1227,420)">
      <rect width="522" height="170" rx="16" fill="#e3f3f0" stroke="#1f8a7e" stroke-width="2"/>
      <text x="28" y="40" font-size="24" font-weight="700">Bản chụp cố định</text>
      <text x="28" y="66" font-size="17" font-style="italic" fill="#5b6b80">snapshot dùng để đánh giá</text>
      <use href="#dot" x="34" y="94"/><text x="48" y="100">Khóa lại một phiên bản dữ liệu</text>
      <use href="#dot" x="34" y="122"/><text x="48" y="128">Mọi lần chấm điểm dùng chung</text>
      <circle cx="40" cy="149" r="12" fill="#1f8a7e"/>
      <path d="M34,149 l4,4 l8,-8" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="62" y="156" font-weight="700">Kết quả so sánh được với nhau</text>
    </g>
  </g>
</svg>
