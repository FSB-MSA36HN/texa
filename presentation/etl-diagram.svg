<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="620" viewBox="0 0 1500 620" font-family="Arial, sans-serif"><rect width="1500" height="620" fill="#f7f9fc"/><text x="750" y="60" text-anchor="middle" font-size="34" font-weight="700" fill="#14284b">Chuẩn hóa hình dạng, giữ đúng giới hạn nguồn</text><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f8a7e"/></marker></defs><g fill="#fff" stroke="#cbd5e1" stroke-width="2"><rect x="80" y="160" width="330" height="150" rx="18"/><rect x="80" y="360" width="330" height="150" rx="18"/><rect x="585" y="240" width="330" height="170" rx="18"/><rect x="1090" y="240" width="330" height="170" rx="18"/></g><g fill="none" stroke="#1f8a7e" stroke-width="4" marker-end="url(#a)"><path d="M410 235L575 290"/><path d="M410 435L575 360"/><path d="M915 325h165"/></g><g text-anchor="middle" fill="#14284b"><text x="245" y="215" font-size="26" font-weight="700">Cosmetics</text><text x="245" y="255" font-size="19">view · cart · purchase</text><text x="245" y="285" font-size="17">có session / product view</text><text x="245" y="415" font-size="26" font-weight="700">Olist</text><text x="245" y="455" font-size="19">order lifecycle → item events</text><text x="245" y="485" font-size="17">không có session / product view</text><text x="750" y="300" font-size="26" font-weight="700">ETL event rows</text><text x="750" y="340" font-size="19">một hàng = một event</text><text x="750" y="375" font-size="17">không tự làm nguồn tương đương</text><text x="1255" y="300" font-size="26" font-weight="700">event_activity</text><text x="1255" y="340" font-size="19">catalog theo nguồn</text><text x="1255" y="375" font-size="17">một nguồn cho mỗi query</text></g><text x="750" y="565" text-anchor="middle" font-size="18" fill="#526176">Olist purchases = item lines; revenue = giá item BRL, không payment/freight</text></svg>
