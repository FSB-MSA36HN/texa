<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f8a7e"/>
    </marker>
    <g id="okS"><circle r="14" fill="#1f8a7e"/><path d="M-6,0 l4,4 l8,-8" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g id="llm"><rect width="64" height="26" rx="13" fill="#e8a33d"/><text x="32" y="18" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">LLM</text></g>
    <g id="code"><rect width="64" height="26" rx="13" fill="#fff" stroke="#b9c6d6"/><text x="32" y="18" font-size="14" font-weight="700" fill="#5b6b80" text-anchor="middle">code</text></g>
  </defs>
  <rect width="1920" height="1080" fill="#fff"/>

  <text x="90" y="70" font-size="22" font-weight="700" fill="#1f8a7e">TEXA  •  Phần 4 - Proposed methods</text>
  <text x="90" y="142" font-size="54" font-weight="700" fill="#14284b">Ví dụ: từ câu hỏi đến QuerySpec, rồi so với đáp án</text>

  <rect x="90" y="180" width="1740" height="64" rx="32" fill="#fff" stroke="#b9c6d6" stroke-width="2"/>
  <text x="960" y="221" font-size="24" fill="#14284b" text-anchor="middle"><tspan fill="#5b6b80">Câu hỏi:</tspan> <tspan font-style="italic">“Doanh thu theo danh mục của Cosmetics tháng 12/2019”</tspan></text>

  <!-- LEFT: steps -->
  <text x="90" y="300" font-size="26" font-weight="700" fill="#14284b">Các bước hệ thống thực hiện</text>
  <line x1="132" y1="360" x2="132" y2="860" stroke="#cfd8e3" stroke-width="4"/>
  <g font-size="19" fill="#14284b">
    <g transform="translate(90,320)">
      <rect width="770" height="140" rx="14" fill="#fff4e5" stroke="#e8a33d" stroke-width="2"/>
      <circle cx="42" cy="40" r="22" fill="#1f8a7e"/><text x="42" y="48" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">1</text>
      <text x="80" y="48" font-size="23" font-weight="700">Hiểu câu hỏi</text>
      <use href="#llm" x="686" y="22"/>
      <text x="80" y="88">Bản nháp: doanh thu · theo danh mục ·</text>
      <text x="80" y="116">Cosmetics · tháng 12/2019</text>
    </g>
    <g transform="translate(90,480)">
      <rect width="770" height="140" rx="14" fill="#fff" stroke="#d5dde8" stroke-width="2"/>
      <circle cx="42" cy="40" r="22" fill="#1f8a7e"/><text x="42" y="48" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">2</text>
      <text x="80" y="48" font-size="23" font-weight="700">Đối chiếu catalog, hỏi lại nếu cần</text>
      <use href="#code" x="686" y="22"/>
      <text x="80" y="88">“doanh thu” → chỉ số revenue đã được duyệt</text>
      <text x="80" y="116">Đủ rõ → không cần hỏi lại → tạo <tspan font-weight="700" fill="#1f8a7e">QuerySpec</tspan></text>
    </g>
    <g transform="translate(90,640)">
      <rect width="770" height="140" rx="14" fill="#fff" stroke="#d5dde8" stroke-width="2"/>
      <circle cx="42" cy="40" r="22" fill="#1f8a7e"/><text x="42" y="48" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">3</text>
      <text x="80" y="48" font-size="23" font-weight="700">Kiểm tra dữ liệu đủ không</text>
      <use href="#code" x="686" y="22"/>
      <text x="80" y="88">Chỉ số và chiều có trong catalog ✓</text>
      <text x="80" y="116">Cosmetics có ghi nhận sự kiện mua hàng ✓</text>
    </g>
    <g transform="translate(90,800)">
      <rect width="770" height="140" rx="14" fill="#fff" stroke="#d5dde8" stroke-width="2"/>
      <circle cx="42" cy="40" r="22" fill="#1f8a7e"/><text x="42" y="48" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">4</text>
      <text x="80" y="48" font-size="23" font-weight="700">Chạy truy vấn và trả lời</text>
      <use href="#code" x="612" y="22"/><use href="#llm" x="686" y="22"/>
      <text x="80" y="88">SQL tạo từ công thức có sẵn, chạy chỉ đọc</text>
      <text x="80" y="116">Model viết lời, mọi con số do code tính</text>
    </g>
  </g>

  <!-- QuerySpec handoff arrow -->
  <line x1="866" y1="550" x2="912" y2="550" stroke="#1f8a7e" stroke-width="5" marker-end="url(#ah)"/>

  <!-- RIGHT: comparison -->
  <text x="920" y="300" font-size="26" font-weight="700" fill="#14284b">So QuerySpec với đáp án kỳ vọng</text>
  <rect x="920" y="320" width="910" height="56" rx="10" fill="#14284b"/>
  <g font-size="19" font-weight="700" fill="#fff">
    <text x="940" y="355">Trường</text>
    <text x="1140" y="355">Đáp án kỳ vọng</text>
    <text x="1440" y="355">Hệ thống tạo ra</text>
    <text x="1780" y="355" text-anchor="middle">Khớp</text>
  </g>
  <g>
    <rect x="920" y="376" width="910" height="56" fill="#fff"/>
    <rect x="920" y="432" width="910" height="56" fill="#eef2f7"/>
    <rect x="920" y="488" width="910" height="56" fill="#fff"/>
    <rect x="920" y="544" width="910" height="56" fill="#eef2f7"/>
    <rect x="920" y="600" width="910" height="56" fill="#fff"/>
    <rect x="920" y="656" width="910" height="56" fill="#eef2f7"/>
    <rect x="920" y="712" width="910" height="48" fill="#fff"/>
  </g>
  <g font-size="19" font-weight="700" fill="#14284b">
    <text x="940" y="411">Nguồn</text><text x="940" y="467">Dạng câu hỏi</text><text x="940" y="523">Chỉ số</text>
    <text x="940" y="579">Chia theo</text><text x="940" y="635">Bộ lọc</text><text x="940" y="691">Thời gian</text>
  </g>
  <g font-family="Menlo, monospace" font-size="17" fill="#14284b">
    <text x="1140" y="411">["cosmetics_shop"]</text><text x="1440" y="411">["cosmetics_shop"]</text>
    <text x="1140" y="467">breakdown</text><text x="1440" y="467">breakdown</text>
    <text x="1140" y="523">revenue</text><text x="1440" y="523">revenue</text>
    <text x="1140" y="579">["item_category"]</text><text x="1440" y="579">["item_category"]</text>
    <text x="1140" y="635">[]</text><text x="1440" y="635">[]</text>
    <text x="1140" y="691">2019-12-01→12-31</text><text x="1440" y="691">2019-12-01→12-31</text>
  </g>
  <use href="#okS" x="1780" y="404"/><use href="#okS" x="1780" y="460"/><use href="#okS" x="1780" y="516"/>
  <use href="#okS" x="1780" y="572"/><use href="#okS" x="1780" y="628"/><use href="#okS" x="1780" y="684"/>
  <text x="940" y="742" font-size="17" font-style="italic" fill="#8a97a8">Phiên bản catalog, giới hạn số dòng: chi tiết kỹ thuật, không chấm</text>
  <rect x="920" y="376" width="910" height="384" fill="none" stroke="#d5dde8" stroke-width="2"/>

  <rect x="920" y="776" width="910" height="60" rx="10" fill="#e3f3f0" stroke="#1f8a7e" stroke-width="2"/>
  <use href="#okS" x="952" y="806"/>
  <text x="980" y="814" font-size="22" font-weight="700" fill="#14284b">ĐẠT: 6/6 trường khớp → hệ thống hiểu đúng câu hỏi</text>

  <rect x="920" y="852" width="910" height="88" rx="10" fill="#fbeaea" stroke="#c0504d" stroke-width="1.5"/>
  <text x="944" y="888" font-size="19" fill="#14284b">Nếu hệ thống ghi <tspan font-weight="700">tháng 11</tspan> → lệch “Thời gian” → <tspan font-weight="700" fill="#c0504d">TRƯỢT</tspan></text>
  <text x="944" y="918" font-size="19" fill="#14284b">và biết ngay lỗi nằm ở <tspan font-weight="700">bước 1 (hiểu câu hỏi)</tspan>, không phải phần tính</text>

  <!-- takeaway -->
  <rect x="90" y="966" width="1740" height="76" rx="14" fill="#eef2f7"/>
  <text x="120" y="1012" font-size="21" fill="#14284b"><tspan font-weight="700">QuerySpec là điểm nối giữa phần hiểu (model) và phần tính (code):</tspan>  lệch QuerySpec → lỗi hiểu  ·  QuerySpec đúng mà số sai → lỗi tính</text>
</svg>
