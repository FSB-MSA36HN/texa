<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" font-family="Arial, sans-serif"><rect width="1500" height="760" fill="#f7f9fc"/><text x="750" y="60" text-anchor="middle" font-size="34" font-weight="700" fill="#14284b">QuerySpec giữ ý định có thể kiểm tra</text><rect x="80" y="120" width="1340" height="95" rx="16" fill="#e3f3f0"/><text x="750" y="178" text-anchor="middle" font-size="25" fill="#14284b">“Tháng 12 năm 2019, doanh thu Cosmetics theo thương hiệu là bao nhiêu?”</text><g fill="#fff" stroke="#cbd5e1" stroke-width="2"><rect x="80" y="270" width="620" height="350" rx="16"/><rect x="800" y="270" width="620" height="350" rx="16"/></g><text x="390" y="320" text-anchor="middle" font-size="25" font-weight="700" fill="#14284b">Candidate → QuerySpec</text><text x="840" y="375" font-size="21" fill="#35445a">recipe: revenue</text><text x="840" y="425" font-size="21" fill="#35445a">source_ids: cosmetics_shop</text><text x="840" y="475" font-size="21" fill="#35445a">time_range: 2019-12-01 → 2019-12-31</text><text x="840" y="525" font-size="21" fill="#35445a">selection: item_brand</text><text x="390" y="390" text-anchor="middle" font-size="20" fill="#35445a">LLM chọn ID catalog</text><text x="390" y="435" text-anchor="middle" font-size="20" fill="#35445a">Validator kiểm tra metric/source</text><text x="390" y="480" text-anchor="middle" font-size="20" fill="#35445a">Trường cấu trúc được xác định</text><text x="390" y="525" text-anchor="middle" font-size="20" fill="#35445a">Hợp lệ? → compiler sinh SQL</text><text x="750" y="680" text-anchor="middle" font-size="18" fill="#526176">Ví dụ minh họa QuerySpec; khoảng thời gian gồm cả ngày bắt đầu và kết thúc.</text></svg>
