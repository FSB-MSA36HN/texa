<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="770" viewBox="0 0 1800 770" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f8a7e"/>
    </marker>
    <rect id="code" width="380" height="120" rx="14" fill="#fff" stroke="#d5dde8" stroke-width="2"/>
    <rect id="llm" width="380" height="120" rx="14" fill="#fff4e5" stroke="#e8a33d" stroke-width="2"/>
    <g id="badge"><rect x="298" y="14" width="64" height="26" rx="13" fill="#e8a33d"/><text x="330" y="32" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">LLM</text></g>
  </defs>
  <rect width="1800" height="770" fill="#fff"/>

  <!-- phase headers -->
  <g font-size="24" font-weight="700" fill="#fff">
    <rect x="50" y="30" width="380" height="64" rx="14" fill="#14284b"/>
    <rect x="490" y="30" width="380" height="64" rx="14" fill="#14284b"/>
    <rect x="930" y="30" width="380" height="64" rx="14" fill="#14284b"/>
    <rect x="1370" y="30" width="380" height="64" rx="14" fill="#14284b"/>
    <g fill="#1f8a7e"><circle cx="88" cy="62" r="20"/><circle cx="528" cy="62" r="20"/><circle cx="968" cy="62" r="20"/><circle cx="1408" cy="62" r="20"/></g>
    <g text-anchor="middle"><text x="88" y="70">1</text><text x="528" y="70">2</text><text x="968" y="70">3</text><text x="1408" y="70">4</text></g>
    <text x="122" y="70">Hiểu câu hỏi</text>
    <text x="562" y="70">Kiểm tra dữ liệu đủ không</text>
    <text x="1002" y="70">Chạy truy vấn an toàn</text>
    <text x="1442" y="70">Trả lời dựa trên kết quả</text>
  </g>

  <!-- arrows -->
  <g stroke="#1f8a7e" stroke-width="5" marker-end="url(#ah)">
    <line x1="438" y1="62" x2="482" y2="62"/>
    <line x1="878" y1="62" x2="922" y2="62"/>
    <line x1="1318" y1="62" x2="1362" y2="62"/>
  </g>
  <g stroke="#1f8a7e" stroke-width="4" marker-end="url(#ah)">
    <line x1="240" y1="251" x2="240" y2="273"/><line x1="240" y1="405" x2="240" y2="427"/>
    <line x1="680" y1="251" x2="680" y2="273"/>
    <line x1="1120" y1="251" x2="1120" y2="273"/><line x1="1120" y1="405" x2="1120" y2="427"/>
    <line x1="1560" y1="251" x2="1560" y2="273"/><line x1="1560" y1="405" x2="1560" y2="427"/>
  </g>

  <g font-size="17" fill="#14284b">
    <!-- column 1 -->
    <g transform="translate(50,125)">
      <use href="#llm"/>
      <rect x="236" y="14" width="126" height="26" rx="13" fill="#e8a33d"/><text x="299" y="32" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">LLM · tùy chọn</text>
      <text x="20" y="36" font-size="22" font-weight="700">Chọn phần liên quan</text>
      <text x="20" y="60" font-size="16" font-style="italic" fill="#5b6b80">shortlist</text>
      <text x="20" y="88">Chỉ dùng khi catalog lớn: lọc bớt</text>
      <text x="20" y="110">chỉ số không liên quan</text>
    </g>
    <g transform="translate(50,279)">
      <use href="#llm"/><use href="#badge"/>
      <text x="20" y="36" font-size="22" font-weight="700">Hiểu ý câu hỏi</text>
      <text x="20" y="60" font-size="16" font-style="italic" fill="#5b6b80">interpret · gọi model lần 1</text>
      <text x="20" y="88">Câu hỏi + catalog → bản nháp:</text>
      <text x="20" y="110">chỉ số, chia nhóm, thời gian</text>
    </g>
    <g transform="translate(50,433)">
      <use href="#code"/>
      <text x="20" y="36" font-size="22" font-weight="700">Hỏi lại nếu chưa rõ</text>
      <text x="20" y="60" font-size="16" font-style="italic" fill="#5b6b80">clarify</text>
      <text x="20" y="88">Mơ hồ → hỏi lại bằng nút bấm</text>
      <text x="20" y="110">Đủ rõ → tạo <tspan font-weight="700" fill="#1f8a7e">QuerySpec</tspan></text>
    </g>

    <!-- column 2 -->
    <g transform="translate(490,125)">
      <use href="#code"/>
      <text x="20" y="36" font-size="22" font-weight="700">Kiểm tra hợp lệ</text>
      <text x="20" y="60" font-size="16" font-style="italic" fill="#5b6b80">validator</text>
      <text x="20" y="88">Chỉ số, nguồn, bộ lọc có thật</text>
      <text x="20" y="110">trong catalog? Đúng giới hạn?</text>
    </g>
    <g transform="translate(490,279)">
      <use href="#code"/>
      <text x="20" y="36" font-size="22" font-weight="700">Kiểm tra dữ liệu đủ không</text>
      <text x="20" y="60" font-size="16" font-style="italic" fill="#5b6b80">availability check</text>
      <text x="20" y="88">Nguồn không ghi nhận → từ chối</text>
      <text x="20" y="110">hoặc nêu rõ, không báo số 0</text>
    </g>

    <!-- column 3 -->
    <g transform="translate(930,125)">
      <use href="#code"/>
      <text x="20" y="36" font-size="22" font-weight="700">Tạo câu lệnh SQL</text>
      <text x="20" y="60" font-size="16" font-style="italic" fill="#5b6b80">compiler</text>
      <text x="20" y="88">Dùng công thức định nghĩa sẵn,</text>
      <text x="20" y="110">tên cột chỉ lấy từ catalog</text>
    </g>
    <g transform="translate(930,279)">
      <use href="#code"/>
      <text x="20" y="36" font-size="22" font-weight="700">Chạy truy vấn</text>
      <text x="20" y="60" font-size="16" font-style="italic" fill="#5b6b80">execute</text>
      <text x="20" y="88">Tài khoản chỉ đọc,</text>
      <text x="20" y="110">giới hạn số dòng trả về</text>
    </g>
    <g transform="translate(930,433)">
      <use href="#code"/>
      <text x="20" y="36" font-size="22" font-weight="700">Tính các con số</text>
      <text x="20" y="60" font-size="16" font-style="italic" fill="#5b6b80">facts</text>
      <text x="20" y="88">Code tính tổng, tỷ lệ, xu hướng</text>
      <text x="20" y="110">→ danh sách số có nguồn gốc</text>
    </g>

    <!-- column 4 -->
    <g transform="translate(1370,125)">
      <use href="#llm"/><use href="#badge"/>
      <text x="20" y="36" font-size="22" font-weight="700">Viết câu trả lời</text>
      <text x="20" y="60" font-size="16" font-style="italic" fill="#5b6b80">insight · gọi model lần 2</text>
      <text x="20" y="88">Chỉ trích số qua mã [[f_…]],</text>
      <text x="20" y="110">không tự gõ con số nào</text>
    </g>
    <g transform="translate(1370,279)">
      <use href="#code"/>
      <text x="20" y="36" font-size="22" font-weight="700">Thay số thật &amp; lọc</text>
      <text x="20" y="60" font-size="16" font-style="italic" fill="#5b6b80">server</text>
      <text x="20" y="88">Thay mã bằng số thật; câu dẫn</text>
      <text x="20" y="110">số không có nguồn bị bỏ</text>
    </g>
    <g transform="translate(1370,433)">
      <rect width="380" height="120" rx="14" fill="#e3f3f0" stroke="#1f8a7e" stroke-width="2"/>
      <circle cx="34" cy="30" r="13" fill="#1f8a7e"/>
      <path d="M28,30 l4,4 l8,-8" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="56" y="37" font-size="22" font-weight="700">Câu trả lời</text>
      <text x="20" y="80">Số + nhận xét + cảnh báo</text>
      <text x="20" y="104">Kèm SQL và chi tiết để kiểm tra</text>
    </g>
  </g>

  <!-- catalog foundation -->
  <rect x="50" y="600" width="1260" height="84" rx="14" fill="#eef2f7" stroke="#b9c6d6" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="80" y="636" font-size="22" font-weight="700" fill="#14284b">Catalog ngữ nghĩa <tspan font-size="17" font-weight="400" fill="#5b6b80">· nền tảng cho bước 1–3</tspan></text>
  <text x="80" y="666" font-size="17" fill="#14284b">Định nghĩa chỉ số và chiều phân tích đã duyệt · mỗi nguồn có sự kiện gì · dữ liệu đến ngày nào · tiền tệ</text>

  <!-- legend -->
  <g font-size="17" fill="#14284b">
    <rect x="50" y="718" width="34" height="24" rx="6" fill="#fff4e5" stroke="#e8a33d" stroke-width="2"/>
    <text x="96" y="736">Gọi mô hình ngôn ngữ (LLM)</text>
    <rect x="370" y="718" width="34" height="24" rx="6" fill="#fff" stroke="#d5dde8" stroke-width="2"/>
    <text x="416" y="736">Code kiểm soát, không dùng mô hình</text>
  </g>
</svg>
