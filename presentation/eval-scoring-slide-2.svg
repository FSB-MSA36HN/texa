<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" font-family="Arial, sans-serif"><rect width="1500" height="760" fill="#f7f9fc"/><text x="750" y="60" text-anchor="middle" font-size="34" font-weight="700" fill="#14284b">Dev checks: báo cả điểm đầu và lượt tinh chỉnh</text><g fill="#fff" stroke="#cbd5e1" stroke-width="2"><rect x="100" y="135" width="620" height="270" rx="18"/><rect x="780" y="135" width="620" height="270" rx="18"/><rect x="100" y="465" width="1300" height="165" rx="18" fill="#fff4e5" stroke="#e8a33d"/></g><g text-anchor="middle" fill="#14284b"><text x="410" y="190" font-size="27" font-weight="700">41 câu đơn · dev</text><text x="410" y="250" font-size="23">Direct SQL: 40/41</text><text x="410" y="295" font-size="23">Texa ban đầu: 37/41</text><text x="410" y="350" font-size="18" fill="#526176">cùng model, schema, fixture</text><text x="1090" y="190" font-size="27" font-weight="700">Sau tinh chỉnh · dev</text><text x="1090" y="250" font-size="23">Texa đơn: 41/41</text><text x="1090" y="295" font-size="23">Hội thoại: 6/6 (19/19 lượt)</text><text x="1090" y="350" font-size="18" fill="#526176">sau hướng dẫn + sửa memory/date</text><text x="750" y="520" font-size="22" font-weight="700" fill="#8b4a09">Development checks — không phải held-out test</text><text x="750" y="565" font-size="20" fill="#35445a">Lượt đầu không chứng minh Texa vượt baseline; live ablation theo protocol chưa hoàn tất.</text><text x="750" y="700" font-size="18" fill="#526176">Không so trực tiếp các con số giữa các vòng; thay đổi prompt/version và điều kiện chạy.</text></g></svg>
