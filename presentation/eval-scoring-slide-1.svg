<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" font-family="Arial, sans-serif"><rect width="1500" height="760" fill="#f7f9fc"/><text x="750" y="60" text-anchor="middle" font-size="34" font-weight="700" fill="#14284b">Đánh giá truy vấn và hội thoại riêng biệt</text><g fill="#fff" stroke="#cbd5e1" stroke-width="2"><rect x="80" y="135" width="650" height="240" rx="18"/><rect x="770" y="135" width="650" height="240" rx="18"/><rect x="80" y="425" width="650" height="220" rx="18"/><rect x="770" y="425" width="650" height="220" rx="18"/></g><g text-anchor="middle" fill="#14284b"><text x="405" y="190" font-size="27" font-weight="700">Chỉ số chính · câu cần trả lời</text><text x="405" y="250" font-size="23">Execution Accuracy</text><text x="405" y="295" font-size="21" font-weight="700">kết quả truy vấn đúng / yêu cầu cần trả lời</text><text x="405" y="335" font-size="17" fill="#526176">so kết quả, không so chuỗi SQL</text><text x="1095" y="190" font-size="27" font-weight="700">Chỉ số hội thoại</text><text x="1095" y="250" font-size="21">scenario success · action · slots</text><text x="1095" y="290" font-size="19">tham chiếu và kết quả cuối</text><text x="1095" y="335" font-size="17" fill="#526176">secondary; không phải “điểm insight”</text><text x="405" y="480" font-size="27" font-weight="700">Dataset v2 · single query</text><text x="405" y="530" font-size="21">96 events · 104 câu</text><text x="405" y="570" font-size="19">41 dev · 63 test</text><text x="405" y="610" font-size="17" fill="#526176">test 63 câu chưa chạy</text><text x="1095" y="480" font-size="27" font-weight="700">Bộ ablation riêng</text><text x="1095" y="530" font-size="21">24 hội thoại memory</text><text x="1095" y="570" font-size="19">20 câu mơ hồ + 20 đối chứng</text><text x="1095" y="610" font-size="17" fill="#526176">live run theo protocol chưa hoàn tất</text></g></svg>
