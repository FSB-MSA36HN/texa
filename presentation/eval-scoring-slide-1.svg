<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f8a7e"/>
    </marker>
    <rect id="flow" width="300" height="130" rx="16" fill="#fff" stroke="#d5dde8" stroke-width="2"/>
    <rect id="pill" width="260" height="40" rx="20" fill="#e3f3f0" stroke="#1f8a7e" stroke-width="1.5"/>
  </defs>
  <rect width="1920" height="1080" fill="#fff"/>

  <text x="90" y="70" font-size="22" font-weight="700" fill="#1f8a7e">TEXA  •  Phần 4 - Evaluation</text>
  <text x="90" y="142" font-size="54" font-weight="700" fill="#14284b">Kỹ thuật chấm đề xuất: so đầu ra với đáp án, từng trường</text>

  <!-- flow row -->
  <g stroke="#1f8a7e" stroke-width="5" marker-end="url(#ah)">
    <line x1="398" y1="265" x2="442" y2="265"/>
    <line x1="758" y1="265" x2="802" y2="265"/>
    <line x1="1118" y1="265" x2="1162" y2="265"/>
    <line x1="1478" y1="265" x2="1522" y2="265"/>
  </g>
  <g fill="#14284b">
    <g transform="translate(90,200)"><use href="#flow"/>
      <text x="24" y="46" font-size="26" font-weight="700">Câu hỏi</text>
      <text x="24" y="82" font-size="19" fill="#5b6b80">mỗi câu kèm đáp án</text>
      <text x="24" y="108" font-size="19" fill="#5b6b80">kỳ vọng viết trước</text></g>
    <g transform="translate(450,200)"><use href="#flow"/>
      <text x="24" y="46" font-size="26" font-weight="700">Hệ thống chạy</text>
      <text x="24" y="82" font-size="19" fill="#5b6b80">đủ cả luồng: hiểu câu hỏi,</text>
      <text x="24" y="108" font-size="19" fill="#5b6b80">kiểm tra, hỏi lại</text></g>
    <g transform="translate(810,200)"><use href="#flow"/>
      <text x="24" y="46" font-size="26" font-weight="700">Đầu ra hệ thống</text>
      <text x="24" y="82" font-size="19" fill="#5b6b80">status · QuerySpec cuối</text>
      <text x="24" y="108" font-size="19" fill="#5b6b80">form hỏi lại · nguồn của số</text></g>
    <g transform="translate(1170,200)"><use href="#flow"/>
      <text x="24" y="46" font-size="26" font-weight="700">So với đáp án</text>
      <text x="24" y="82" font-size="19" fill="#5b6b80">chỉ những trường</text>
      <text x="24" y="108" font-size="19" fill="#5b6b80">đáp án có khai báo</text></g>
    <g transform="translate(1530,200)">
      <rect width="300" height="130" rx="16" fill="#e3f3f0" stroke="#1f8a7e" stroke-width="2"/>
      <text x="24" y="46" font-size="26" font-weight="700">Kết quả</text>
      <text x="24" y="82" font-size="19">Lệch 0 trường → <tspan font-weight="700" fill="#1f8a7e">ĐẠT</tspan></text>
      <text x="24" y="108" font-size="19">Lệch ≥ 1 trường → <tspan font-weight="700" fill="#c0504d">TRƯỢT</tspan></text></g>
  </g>

  <!-- step 1 -->
  <rect x="90" y="410" width="520" height="490" rx="16" fill="#eef2f7"/>
  <circle cx="132" cy="452" r="22" fill="#1f8a7e"/>
  <text x="132" y="461" font-size="24" font-weight="700" fill="#fff" text-anchor="middle">1</text>
  <text x="168" y="462" font-size="30" font-weight="700" fill="#14284b">So trạng thái trước</text>
  <text x="114" y="506" font-size="20" fill="#5b6b80">trạng thái hệ thống = trạng thái kỳ vọng?</text>
  <g font-size="19" fill="#14284b">
    <rect x="114" y="530" width="472" height="44" rx="10" fill="#fff"/><text x="132" y="559"><tspan font-family="Menlo, monospace" font-size="17" fill="#1f8a7e">answered</tspan>  ·  trả lời</text>
    <rect x="114" y="588" width="472" height="44" rx="10" fill="#fff"/><text x="132" y="617"><tspan font-family="Menlo, monospace" font-size="17" fill="#1f8a7e">needs_clarification</tspan>  ·  hỏi lại</text>
    <rect x="114" y="646" width="472" height="44" rx="10" fill="#fff"/><text x="132" y="675"><tspan font-family="Menlo, monospace" font-size="17" fill="#1f8a7e">refused</tspan>  ·  từ chối</text>
    <rect x="114" y="704" width="472" height="44" rx="10" fill="#fff"/><text x="132" y="733"><tspan font-family="Menlo, monospace" font-size="17" fill="#1f8a7e">conversation</tspan>  ·  trò chuyện</text>
    <rect x="114" y="762" width="472" height="44" rx="10" fill="#fff"/><text x="132" y="791"><tspan font-family="Menlo, monospace" font-size="17" fill="#1f8a7e">discussed</tspan>  ·  bàn trên kết quả cũ</text>
  </g>
  <rect x="114" y="828" width="472" height="50" rx="10" fill="#fbeaea" stroke="#c0504d" stroke-width="1.5"/>
  <text x="134" y="860" font-size="20" fill="#14284b">Sai trạng thái → <tspan font-weight="700" fill="#c0504d">TRƯỢT ngay</tspan>, không chấm tiếp</text>

  <!-- connectors -->
  <g stroke="#1f8a7e" stroke-width="4" fill="none">
    <line x1="610" y1="655" x2="650" y2="655"/>
    <line x1="650" y1="465" x2="650" y2="860"/>
  </g>
  <g stroke="#1f8a7e" stroke-width="4" marker-end="url(#ah)">
    <line x1="650" y1="465" x2="694" y2="465"/>
    <line x1="650" y1="670" x2="694" y2="670"/>
    <line x1="650" y1="860" x2="694" y2="860"/>
  </g>
  <text x="614" y="643" font-size="17" font-weight="700" fill="#1f8a7e">đúng</text>

  <!-- step 2 header -->
  <circle cx="722" cy="384" r="18" fill="#1f8a7e"/>
  <text x="722" y="391" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">2</text>
  <text x="750" y="392" font-size="24" font-weight="700" fill="#14284b">Đúng trạng thái → chấm chi tiết theo từng tình huống</text>

  <!-- branch A: clarification -->
  <rect x="700" y="410" width="1130" height="110" rx="16" fill="#fff" stroke="#d5dde8" stroke-width="2"/>
  <use href="#pill" x="724" y="445"/>
  <text x="854" y="471" font-family="Menlo, monospace" font-size="17" fill="#14284b" text-anchor="middle">needs_clarification</text>
  <text x="1008" y="458" font-size="22" font-weight="700" fill="#14284b">Các trường kỳ vọng phải hỏi ⊆ các trường trong form hỏi lại</text>
  <text x="1008" y="494" font-size="19" fill="#5b6b80">VD: “Số người mua theo tuần” → phải hỏi cả source lẫn time_range</text>

  <!-- branch B: answered -->
  <rect x="700" y="540" width="1130" height="260" rx="16" fill="#fff" stroke="#d5dde8" stroke-width="2"/>
  <use href="#pill" x="724" y="560"/>
  <text x="854" y="586" font-family="Menlo, monospace" font-size="17" fill="#14284b" text-anchor="middle">answered</text>
  <text x="1008" y="588" font-size="22" font-weight="700" fill="#14284b">So QuerySpec cuối <tspan font-weight="400" fill="#5b6b80" font-size="19">(bản đã qua validator, thực sự đem đi chạy)</tspan></text>
  <g font-size="19" fill="#14284b">
    <line x1="724" y1="616" x2="1806" y2="616" stroke="#e3e8ef"/>
    <text x="724" y="646" font-weight="700">Chỉ số</text>
    <text x="1008" y="646" font-family="Menlo, monospace" font-size="16" fill="#1f8a7e">metric</text>
    <text x="1340" y="646">khớp, hoặc thuộc các cách tính chấp nhận</text>
    <line x1="724" y1="661" x2="1806" y2="661" stroke="#e3e8ef"/>
    <text x="724" y="691" font-weight="700">Nhóm · nguồn · chỉ số</text>
    <text x="1008" y="691" font-family="Menlo, monospace" font-size="16" fill="#1f8a7e">dimensions · sources</text>
    <text x="1340" y="691">so như tập hợp, bỏ qua thứ tự</text>
    <line x1="724" y1="706" x2="1806" y2="706" stroke="#e3e8ef"/>
    <text x="724" y="736" font-weight="700">Bộ lọc</text>
    <text x="1008" y="736" font-family="Menlo, monospace" font-size="16" fill="#1f8a7e">filters</text>
    <text x="1340" y="736">cùng trường; giá trị bỏ qua hoa/thường</text>
    <line x1="724" y1="751" x2="1806" y2="751" stroke="#e3e8ef"/>
    <text x="724" y="781" font-weight="700">Thời gian</text>
    <text x="1008" y="781" font-family="Menlo, monospace" font-size="16" fill="#1f8a7e">time_range</text>
    <text x="1340" y="781">kind, days, start, end sau khi quy đổi</text>
  </g>

  <!-- branch C: refused / conversation -->
  <rect x="700" y="820" width="1130" height="80" rx="16" fill="#fff" stroke="#d5dde8" stroke-width="2"/>
  <use href="#pill" x="724" y="840"/>
  <text x="854" y="866" font-family="Menlo, monospace" font-size="17" fill="#14284b" text-anchor="middle">refused · conversation</text>
  <text x="1008" y="868" font-size="22" font-weight="700" fill="#14284b">Chỉ cần đúng trạng thái là đạt</text>

  <!-- calc strip -->
  <rect x="90" y="925" width="1740" height="80" rx="16" fill="#fff4e5" stroke="#e8a33d" stroke-width="2"/>
  <text x="120" y="974" font-size="21" fill="#14284b"><tspan font-weight="700">Áp dụng cho mọi trạng thái:</tspan>  đáp án có thể yêu cầu câu trả lời phải có số do hệ thống tính, hoặc cấm số tự tính và tỷ giá người dùng chưa đưa</text>

  <text x="1830" y="1055" font-size="18" fill="#5b6b80" text-anchor="end">Trường nào không khai báo trong đáp án thì không chấm</text>
</svg>
