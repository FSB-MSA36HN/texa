# Production-like demo stack for one Oracle Cloud VM.
# Run with: docker compose -f docker-compose.demo.yml --env-file .env.demo up -d --build
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-texa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.demo}
      POSTGRES_DB: ${POSTGRES_DB:-texa}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./pipeline/sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    expose:
      - "5432"

  api:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TEXA_DB_DSN: postgresql://${POSTGRES_USER:-texa}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-texa}
      TEXA_READER_DSN: postgresql://${POSTGRES_USER:-texa}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-texa}
      TEXA_SHARED_DEMO: "true"
      TEXA_ADMIN_TOKEN: ${TEXA_ADMIN_TOKEN:?Set TEXA_ADMIN_TOKEN in .env.demo}
      TEXA_COOKIE_SECURE: "true"
      TEXA_CORS_ORIGINS: ${TEXA_CORS_ORIGINS:-https://texa.example.com}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env.demo}
      TEXA_BASE_URL: ${TEXA_BASE_URL:?Set TEXA_BASE_URL in .env.demo}
      TEXA_DEFAULT_MODEL: ${TEXA_DEFAULT_MODEL:-gpt-6-luna}
      TEXA_LLM_MAX_INFLIGHT: ${TEXA_LLM_MAX_INFLIGHT:-4}
      TEXA_LLM_MAX_WAITERS: ${TEXA_LLM_MAX_WAITERS:-16}
      TEXA_LLM_QUEUE_TIMEOUT_S: ${TEXA_LLM_QUEUE_TIMEOUT_S:-30}
    volumes:
      - ./catalog:/app/catalog:ro
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

  etl:
    profiles: ["etl"]
    build:
      context: ./pipeline
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TEXA_DW_DSN: postgresql://${POSTGRES_USER:-texa}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-texa}
      TEXA_LANDING_DIR: /opt/texa/data/landing
      TEXA_SQL_DIR: /opt/texa/pipeline/sql
      REES46_MONTHS: ${REES46_MONTHS:-2019-Dec,2020-Jan}
    volumes:
      - ./data:/opt/texa/data

  web:
    build:
      context: ./web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
