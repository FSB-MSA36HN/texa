# Product analytics scope. Legacy catalog remains ecommerce.yaml.
version: 2
table: analytics.event_activity
allowed_sources:
- cosmetics_shop
- olist_marketplace
evaluation_sources:
- event_benchmark
source_aliases:
  cosmetics_shop: [cosmetics, "cosmetics shop", "shop mỹ phẩm", "cửa hàng mỹ phẩm"]
  olist_marketplace: [olist, "olist marketplace", "sàn olist"]
  event_benchmark: ["event benchmark", benchmark, "bộ dữ liệu benchmark"]
event_roles:
- id: any_event
  label: Any tracked event
  description: Logged events in the selected e-commerce product. Active users are
    observed users, not all registered users.
  events:
  - view
  - cart
  - remove_from_cart
  - purchase
  - order_purchased
  - order_approved
  - order_shipped
  - order_delivered
  - order_canceled
  - payment_made
  - review_submitted
- id: product_view
  label: Product view
  description: A product page was viewed.
  events:
  - view
- id: purchase
  label: Item purchased
  description: One purchased item line. Not an order and not a session.
  alternatives: true
  events:
  - purchase
  - order_purchased
dimensions:
- id: event_date
  label: Day
  labels: {vi: Ngày}
  descriptions: {vi: 'Ngày diễn ra sự kiện.'}
  kind: time
  field: event_date
  grain: day
  synonyms:
  - date
  - daily
  - by day
  - ngày
- id: event_week
  label: Week
  labels: {vi: Tuần}
  descriptions: {vi: 'Gom dữ liệu theo tuần diễn ra sự kiện.'}
  kind: time
  field: event_date
  grain: week
  synonyms:
  - weekly
  - by week
  - tuần
- id: event_month
  label: Month
  labels: {vi: Tháng}
  descriptions: {vi: 'Gom dữ liệu theo tháng diễn ra sự kiện.'}
  kind: time
  field: event_date
  grain: month
  synonyms:
  - monthly
  - by month
  - tháng
- id: source
  label: Store
  labels: {vi: Cửa hàng}
  description: Which data source (store) the event came from.
  descriptions: {vi: 'Nguồn dữ liệu của cửa hàng.'}
  kind: source
  synonyms:
  - shop
  - store
  - data source
  - nguồn
  - cửa hàng
- id: event_name
  label: Event name
  labels: {vi: Tên sự kiện}
  description: Raw event name as the source logs it.
  descriptions: {vi: 'Tên sự kiện gốc do nguồn dữ liệu ghi nhận; không dịch giá trị khi truy vấn.'}
  field: event_name
  synonyms:
  - event
  - event type
  - sự kiện
- id: item_category
  label: Product category
  labels: {vi: Danh mục sản phẩm}
  description: Top-level product category.
  descriptions: {vi: 'Nhóm sản phẩm cấp cao nhất trong dữ liệu.'}
  field: item_category
  synonyms:
  - category
  - danh mục
  - ngành hàng
- id: item_brand
  label: Brand
  labels: {vi: Thương hiệu}
  field: item_brand
  synonyms:
  - brand
  - thương hiệu
  - nhãn hàng
- id: device_type
  label: Thiết bị
  description: Scalar device type from a nested object; missing or JSON null groups
    as SQL NULL.
  field: ep.device.type
  synonyms:
  - thiết bị
  - device
  - device type
- id: campaign_channel
  label: Kênh chiến dịch
  description: Nested campaign channel; synthetic benchmark only when the real source
    does not track it.
  field: ep.campaign.channel
  synonyms:
  - kênh
  - campaign channel
  - channel
metrics:
- id: users
  intent_grain: user_period
  label: Users
  labels: {vi: Người dùng}
  description: Distinct users with any event in the period. Olist observes only customers
    who ordered, not all website visitors; source populations are not comparable.
  descriptions: {vi: 'Số người dùng duy nhất có sự kiện được ghi nhận trong kỳ. Olist chỉ quan sát khách đã đặt hàng, không phải toàn bộ khách truy cập.'}
  synonyms:
  - active users
  - customers
  - người dùng
  - khách hàng
  type: simple
  group_domain: metric_support
  unit: count
  simple:
    aggregation: count_users
    event_role: any_event
- id: events
  intent_grain: event_row
  label: Events
  labels: {vi: Lượt sự kiện}
  description: Number of logged events of any kind.
  descriptions: {vi: 'Tổng số sự kiện được ghi nhận trong kỳ.'}
  synonyms:
  - event count
  - số sự kiện
  type: simple
  group_domain: metric_support
  unit: count
  simple:
    aggregation: count_events
    event_role: any_event
- id: sessions
  intent_grain: session_period
  label: Sessions
  labels: {vi: Phiên truy cập}
  description: Distinct session IDs on sources that record session_id; availability is determined from source metadata.
  descriptions: {vi: 'Số mã phiên truy cập duy nhất; chỉ tính khi nguồn ghi nhận session_id, theo metadata hiện tại.'}
  synonyms:
  - visits
  - phiên
  type: simple
  group_domain: metric_support
  unit: count
  simple:
    aggregation: count_distinct
    event_role: any_event
    field: session_id
- id: viewers
  intent_grain: product_viewer_period
  label: Users who viewed
  labels: {vi: Người xem sản phẩm}
  description: Distinct users with a product view.
  descriptions: {vi: 'Số người dùng duy nhất đã xem sản phẩm.'}
  synonyms:
  - viewers
  type: simple
  group_domain: metric_support
  unit: count
  simple:
    aggregation: count_users
    event_role: product_view
- id: purchases
  intent_grain: purchased_item_line
  label: Items purchased
  labels: {vi: Sản phẩm đã mua}
  description: Purchased item lines (one per item).
  descriptions: {vi: 'Số dòng sản phẩm đã mua; không phải số đơn hàng.'}
  synonyms:
  - purchases
  - items sold
  - sản phẩm bán ra
  - lượt mua
  type: simple
  group_domain: metric_support
  unit: count
  simple:
    aggregation: count_events
    event_role: purchase
- id: buyers
  intent_grain: purchasing_user_period
  label: Buyers
  labels: {vi: Người mua}
  description: Distinct users with at least one purchase.
  descriptions: {vi: 'Số người dùng duy nhất có ít nhất một sự kiện mua hàng.'}
  synonyms:
  - paying users
  - payers
  - purchasers
  - người mua
  type: simple
  group_domain: metric_support
  unit: count
  simple:
    aggregation: count_users
    event_role: purchase
- id: buyer_conversion_rate
  intent_grain: period_user_ratio
  label: Buyer conversion rate
  labels: {vi: Tỷ lệ người mua}
  description: Distinct buyers / distinct active users in the selected period. This
    is a period-level buyer/user ratio, not an ordered funnel conversion. Olist only
    observes ordering customers; its ratio is not visitor-to-buyer conversion.
  descriptions: {vi: 'Tỷ lệ người mua trên người dùng quan sát được trong kỳ; không phải tỷ lệ chuyển đổi khách truy cập website, đặc biệt với Olist.'}
  synonyms:
  - conversion rate
  - CVR
  - tỉ lệ chuyển đổi
  when_to_use: Conversion of people into buyers.
  type: ratio
  group_domain: metric_support
  unit: percent
  ratio:
    numerator: buyers
    denominator: users
- id: revenue
  intent_grain: purchased_item_line_value
  label: Revenue
  labels: {vi: Doanh thu}
  description: Sum of revenue on purchase item events, in the selected dataset currency;
    excludes tax, freight and refunds unless recorded. Not accounting revenue.
  descriptions: {vi: 'Tổng giá trị sản phẩm trên sự kiện mua hàng, theo tiền tệ của nguồn; không gồm thuế, vận chuyển hoặc hoàn tiền nếu không được ghi nhận. Không phải doanh thu kế toán.'}
  synonyms:
  - sales
  - GMV
  - doanh thu
  - doanh số
  when_to_use: Money from items sold.
  type: simple
  group_domain: metric_support
  unit: currency
  simple:
    aggregation: sum
    event_role: purchase
    field: revenue
semantic_values:
- id: purchase_event
  field: event_name
  label: Sự kiện mua hàng
  synonyms:
  - mua hàng
  - đã mua
  - purchase
  - purchased
  source_values:
    cosmetics_shop: [purchase]
    olist_marketplace: [order_purchased]
    event_benchmark: [purchase]
metric_ambiguities:
- id: sales_amount_or_volume
  phrases: [sales, doanh số, bán được bao nhiêu]
  metric_ids: [revenue, purchases]
  disambiguators:
    revenue: [revenue, doanh thu, amount, value, dollars, tiền]
    purchases: [units, items, item lines, products, quantity, volume, số lượng, sản phẩm]
policy:
  min_sample: 30
  ask_when_missing: []
  max_sources: 1
data_notes:
- source: olist_marketplace
  message: Olist contains order lifecycle, payment and review events, not visitor tracking.
    Sessions and product views are unavailable. Purchases count item lines, not orders;
    revenue uses purchase item prices in BRL and excludes payment events and freight.
  messages:
    vi: Olist ghi nhận vòng đời đơn hàng, thanh toán và đánh giá; không ghi nhận phiên truy cập hay lượt xem sản phẩm. Sản phẩm đã mua được đếm theo dòng sản phẩm; doanh thu bằng BRL, không cộng sự kiện thanh toán hoặc phí vận chuyển.
- source: olist_marketplace
  metric: buyer_conversion_rate
  message: Olist observes ordering customers, not website visitors; this buyer/user ratio is not visitor conversion.
  messages:
    vi: Olist chỉ ghi nhận khách đã đặt hàng. Tỷ lệ người mua/người dùng quan sát trong kỳ không phải tỷ lệ chuyển đổi khách truy cập website.
    en: Olist observes ordering customers, not website visitors; this buyer/user ratio is not visitor conversion.
- scope: One e-commerce event dataset per question; no cross-store totals, currencies,
    orders, arrays or causal claims.
