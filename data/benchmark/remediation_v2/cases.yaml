- id: rv2_test_olist_top_category
  split: test
  family: olist_top_purchase_category
  source_id: olist_marketplace
  language: en
  question: Which Olist product category has the most purchased-item events? Show the top category only.
  gold_sql: SELECT item_category, count(*)::bigint AS purchases FROM analytics.event_activity WHERE source_id='olist_marketplace' AND event_name='order_purchased' GROUP BY item_category ORDER BY purchases DESC LIMIT 1
  expected_result: {columns: [item_category, purchases], rows: [[skin, 3]]}
