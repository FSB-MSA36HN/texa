- id: rv2_test_cosmetics_daily_event_trend
  split: test
  family: cosmetics_daily_event_trend
  source_id: cosmetics_shop
  language: en
  question: Show the number of all event records per day in the cosmetics shop from December 1 to 4, 2019.
  gold_sql: SELECT event_date, count(*)::bigint AS events FROM analytics.event_activity WHERE source_id='cosmetics_shop' AND event_date BETWEEN '2019-12-01' AND '2019-12-04' GROUP BY event_date ORDER BY event_date
  expected_result: {columns: [event_date, events], rows: [["2019-12-01", 2], ["2019-12-02", 2], ["2019-12-03", 2], ["2019-12-04", 2]]}
  ordered: true
  business_contract: {columns: [{id: event_date, actual_alias: event_date, gold_alias: event_date}, {id: event_count, actual_alias: events, gold_alias: events}]}
