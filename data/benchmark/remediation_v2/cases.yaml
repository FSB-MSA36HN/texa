- id: rv2_test_cosmetics_buyer_rate
  split: test
  family: cosmetics_buyer_rate
  source_id: cosmetics_shop
  language: vi
  question: Trong shop mỹ phẩm, tỷ lệ người dùng có mua hàng trên tổng số người dùng quan sát được là bao nhiêu?
  gold_sql: SELECT count(DISTINCT user_id) FILTER (WHERE event_name='purchase')::numeric / NULLIF(count(DISTINCT user_id),0) AS buyer_conversion_rate FROM analytics.event_activity WHERE source_id='cosmetics_shop'
  expected_result: {columns: [buyer_conversion_rate], rows: [[0.6]]}
  business_contract: {columns: [{id: buyer_conversion_rate, actual_alias: buyer_conversion_rate, gold_alias: buyer_conversion_rate}]}
