- id: rv2_cosmetics_users
  split: dev
  family: cosmetics_users_total
  source_id: cosmetics_shop
  language: vi
  question: Có bao nhiêu người dùng riêng biệt trong shop mỹ phẩm?
  gold_sql: SELECT count(DISTINCT user_id)::bigint AS users FROM analytics.event_activity WHERE source_id='cosmetics_shop'
  expected_result: {columns: [users], rows: [[5]]}
  business_contract: {columns: [{id: user_count, actual_alias: users, gold_alias: users}]}
- id: rv2_cosmetics_purchase_revenue
  split: dev
  family: cosmetics_purchase_revenue
  source_id: cosmetics_shop
  language: en
  question: What was the total purchase revenue for the cosmetics shop, in its source currency?
  gold_sql: SELECT sum(revenue)::numeric AS revenue FROM analytics.event_activity WHERE source_id='cosmetics_shop' AND event_name='purchase'
  expected_result: {columns: [revenue], rows: [[60]]}
  business_contract: {columns: [{id: purchase_revenue, actual_alias: revenue, gold_alias: revenue}]}
- id: rv2_cosmetics_category_revenue
  split: dev
  family: cosmetics_category_revenue
  source_id: cosmetics_shop
  language: vi
  question: Chia doanh thu mua hàng của shop mỹ phẩm theo danh mục sản phẩm.
  gold_sql: SELECT item_category, sum(revenue)::numeric AS revenue FROM analytics.event_activity WHERE source_id='cosmetics_shop' AND event_name='purchase' GROUP BY item_category ORDER BY item_category
  expected_result: {columns: [item_category, revenue], rows: [[hair, 0], [makeup, 30], [skin, 30]]}
  ordered: true
  business_contract: {columns: [{id: item_category_dimension, actual_alias: item_category, gold_alias: item_category}, {id: purchase_revenue, actual_alias: revenue, gold_alias: revenue}]}
