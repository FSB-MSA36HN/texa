- id: q01_ambiguous_sales
  split: dev
  family: ambiguous_sales
  question: For Cosmetics in January, what were sales?
  ask_fields:
  - metric
  oracle_intent: resolve_revenue
  oracle_answers:
    metric:
    - revenue
  state:
    source_id: cosmetics_shop
    metric: revenue
    time_range:
    - '2025-01-01'
    - '2025-01-31'
    filters: []
    breakdown: null
  gold_sql: SELECT coalesce(sum(revenue) FILTER (WHERE event_name='purchase'),0) AS revenue FROM analytics.event_activity
    WHERE source_id='cosmetics_shop' AND event_date BETWEEN '2025-01-01' AND '2025-01-31'
  expected_result:
    columns:
    - revenue
    rows:
    - - 185.0
