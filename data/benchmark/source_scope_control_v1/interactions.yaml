- id: q17_period_cosmetics_channel_buyers
  split: dev
  family: period_cosmetics_channel_buyers
  question: How many distinct buyers did Cosmetics Shop have by campaign channel?
  ask_fields:
  - time_range
  oracle_intent: explicit_all_time
  oracle_answers:
    time_range:
    - all
  state:
    source_id: cosmetics_shop
    metric: buyers
    time_range: all
    filters: &id003 []
    breakdown: campaign_channel
  gold_sql: 'SELECT ep #>> ''{campaign,channel}'' AS campaign_channel,count(DISTINCT user_id) AS buyers FROM analytics.event_activity
    WHERE source_id=''cosmetics_shop'' AND event_name=''purchase'' GROUP BY 1 ORDER BY 1 NULLS FIRST'
  expected_result:
    columns:
    - campaign_channel
    - buyers
    rows:
    - - null
      - 1
    - - email
      - 7
    - - paid
      - 8
