- id: d01_keep_filter
  split: dev
  family: keep_clear_filter
  dependency_distance: 1
  turns:
  - question: Cosmetics buyers on Jan 5-7?
    action: answer
    state:
      source_id: cosmetics_shop
      metric: buyers
      time_range:
      - '2025-01-05'
      - '2025-01-07'
      filters: []
      breakdown: null
    gold_sql: SELECT count(DISTINCT user_id) FILTER (WHERE event_name='purchase') AS buyers FROM analytics.event_activity
      WHERE source_id='cosmetics_shop' AND event_date BETWEEN '2025-01-05' AND '2025-01-07'
    expected_result:
      columns:
      - buyers
      rows:
      - - 1
  - question: Only mobile, please.
    action: answer
    state:
      source_id: cosmetics_shop
      metric: buyers
      time_range:
      - '2025-01-05'
      - '2025-01-07'
      filters:
      - device_type: mobile
      breakdown: null
    gold_sql: 'SELECT count(DISTINCT user_id) FILTER (WHERE event_name=''purchase'') AS buyers FROM analytics.event_activity
      WHERE source_id=''cosmetics_shop'' AND event_date BETWEEN ''2025-01-05'' AND ''2025-01-07'' AND ep #>> ''{device,type}''=''mobile'''
    expected_result:
      columns:
      - buyers
      rows:
      - - 0
    referenced_turn: 1
