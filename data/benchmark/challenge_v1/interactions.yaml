- id: q01_ambiguous_sales
  split: dev
  family: ambiguous_sales
  question: For Cosmetics in January, what were sales?
  ask_fields:
  - metric
  oracle_intent: resolve_revenue
  oracle_answers:
    metric:
    - revenue
  state:
    source_id: cosmetics_shop
    metric: revenue
    time_range:
    - '2025-01-01'
    - '2025-01-31'
    filters: []
    breakdown: null
  gold_sql: SELECT coalesce(sum(revenue) FILTER (WHERE event_name='purchase'),0) AS revenue FROM analytics.event_activity
    WHERE source_id='cosmetics_shop' AND event_date BETWEEN '2025-01-01' AND '2025-01-31'
  expected_result:
    columns:
    - revenue
    rows:
    - - 185.0
- id: q02_ambiguous_buyers
  split: test
  family: ambiguous_customer_count
  question: Tháng 1 trên Olist có bao nhiêu khách hàng?
  ask_fields:
  - metric
  oracle_intent: buyers
  oracle_answers:
    metric:
    - buyers
  state:
    source_id: olist_marketplace
    metric: buyers
    time_range:
    - '2018-01-01'
    - '2018-01-31'
    filters: []
    breakdown: null
  gold_sql: SELECT count(DISTINCT user_id) FILTER (WHERE event_name='order_purchased') AS buyers FROM analytics.event_activity
    WHERE source_id='olist_marketplace' AND event_date BETWEEN '2018-01-01' AND '2018-01-31'
  expected_result:
    columns:
    - buyers
    rows:
    - - 8
