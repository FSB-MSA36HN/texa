fixture_policy: Synthetic challenge-only rows registered under the two catalog source IDs. Olist rows use order_purchased,
  payment_made, and order_approved for synthetic observed customers; Olist session_id is NULL and no visitor/viewer
  rows are invented. Synthetic ep.device.type and ep.campaign.channel are declared challenge-only extensions, not
  claims about real Olist. One event_activity row is one event; Olist purchase events model item lines.
metric_policy: events counts rows; users/sessions/viewers/buyers are distinct IDs; viewers require view; buyers
  require purchase; purchases count purchase rows (item-line grain); revenue sums purchase revenue only and empty
  sum is zero; buyer_conversion_rate is distinct buyers / distinct observed users, NULL for zero denominator. Group
  domains contain eligible observed events; ratio groups retain rows supported by numerator OR denominator population,
  so a legitimate zero numerator is retained. Missing/NULL nested scalars do not match filters. No inferred calendar
  rows.
