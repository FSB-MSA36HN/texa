name: texa-ecommerce-workflow-challenge-v1-candidate
dataset_type: challenge_candidate
version: 1
status: candidate_agent_reviewed_not_sealed
engine: PostgreSQL 16+
timezone: UTC
sources: [cosmetics_shop, olist_marketplace]
metrics: [events, users, sessions, viewers, purchases, buyers, revenue, buyer_conversion_rate]
nested_scalar_paths: [ep.device.type, ep.campaign.channel]
fixture: worlds/base.sql
fixture_worlds:
  base: {file: worlds/base.sql, cosmetics_rows: 60, olist_rows: 60}
  grain_counterexample: {file: worlds/grain_counterexample.sql, cosmetics_rows: 60, olist_rows: 61, perturbation: one additional synthetic item-line twin}
  coverage_edge: {file: worlds/coverage_edge.sql, cosmetics_rows: 59, olist_rows: 59, perturbation: one purchase row removed from each source}
fixture_policy: >-
  Synthetic challenge-only rows registered under the two catalog source IDs; apply only in an isolated
  benchmark database. The Olist fixture's device/campaign values are synthetic challenge capabilities,
  not claims about real Olist data. One event_activity row is one event; Olist purchase event rows model
  item lines, and payment rows are separate non-purchase events.
metric_policy: >-
  events counts rows; users/sessions/viewers/buyers are distinct IDs; viewers require view; buyers require
  purchase; purchases count purchase rows (item-line grain); revenue sums purchase revenue only and empty
  sum is zero; buyer_conversion_rate is distinct buyers / distinct observed users, NULL for zero denominator.
  Group domains contain eligible observed events; ratio groups retain rows supported by numerator OR
  denominator population, so a legitimate zero numerator is retained. Missing/NULL nested scalars do not
  match filters. No inferred calendar rows.
result_policy: {row_order: unordered_unless_ranked, numeric_absolute_tolerance: 1.0e-06, numeric_relative_tolerance: 1.0e-06}
counts: {single_total: 60, single_dev: 30, single_test: 30, clarification_total: 12, clarification_dev: 6, clarification_test: 6, conversation_total: 9, conversation_dev: 4, conversation_test: 5, diagnostics: 12}
coverage_gap: >-
  This is a coherent provisional candidate, not the planned 180 single / 24 clarification / 24 dialogue
  suite. Counts and source/language quotas are below design targets; no human review or holdout seal.
quality: {gold_independent_of_compiler: true, human_review: pending, test_labels_exposed_to_author: true, sealed: false}
