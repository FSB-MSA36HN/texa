- id: dlg_short_followup
  split: dev
  dependency_distance: 1
  turns:
  - question: Doanh thu ngày 1/1/2025
    action: answer
    state:
      metric: revenue
      time_range: '2025-01-01'
      filters: []
      breakdown: null
    gold_sql: SELECT sum(revenue)::numeric AS revenue FROM analytics.event_activity
      WHERE source_id='event_benchmark' AND event_name='purchase' AND event_date='2025-01-01'
  - question: Còn trên mobile?
    action: answer
    referenced_turn: 1
    state:
      metric: revenue
      time_range: '2025-01-01'
      filters:
      - device_type: mobile
      breakdown: null
    gold_sql: 'SELECT sum(revenue)::numeric AS revenue FROM analytics.event_activity
      WHERE source_id=''event_benchmark'' AND event_name=''purchase'' AND event_date=''2025-01-01''
      AND ep #>> ''{device,type}''=''mobile'''
- id: dlg_noise
  split: dev
  dependency_distance: 2
  turns:
  - question: Số người mua ngày 2/1/2025
    action: answer
    state:
      metric: buyers
      time_range: '2025-01-02'
      filters: []
      breakdown: null
    gold_sql: SELECT count(DISTINCT user_id)::bigint AS buyers FROM analytics.event_activity
      WHERE source_id='event_benchmark' AND event_name='purchase' AND event_date='2025-01-02'
  - question: Cảm ơn nhé
    action: conversation
  - question: Chia theo thiết bị
    action: answer
    referenced_turn: 1
    state:
      metric: buyers
      time_range: '2025-01-02'
      filters: []
      breakdown: device_type
    gold_sql: 'SELECT ep #>> ''{device,type}'' AS device_type, count(DISTINCT user_id)
      FILTER (WHERE event_name=''purchase'')::bigint AS buyers FROM analytics.event_activity
      WHERE source_id=''event_benchmark'' AND event_date=''2025-01-02'' GROUP BY 1
      ORDER BY 1'
- id: dlg_switch_return
  split: dev
  dependency_distance: 3
  turns:
  - question: Doanh thu theo ngày
    action: clarify
    ask_fields:
    - time_range
  - question: Toàn bộ dữ liệu
    action: clarification_answer
    oracle_answers:
      time_range:
      - all
    state:
      metric: revenue
      time_range: all
      filters: []
      breakdown: event_date
    gold_sql: SELECT event_date, coalesce(sum(revenue) FILTER (WHERE event_name='purchase'),0)::numeric
      AS revenue FROM analytics.event_activity WHERE source_id='event_benchmark' GROUP
      BY 1 ORDER BY 1
  - question: Có bao nhiêu người mua ngày 3/1/2025?
    action: answer
    state:
      metric: buyers
      time_range: '2025-01-03'
      filters: []
      breakdown: null
    gold_sql: SELECT count(DISTINCT user_id)::bigint AS buyers FROM analytics.event_activity
      WHERE source_id='event_benchmark' AND event_name='purchase' AND event_date='2025-01-03'
  - question: Quay lại doanh thu đó, chia theo channel
    action: answer
    referenced_turn: 1
    state:
      metric: revenue
      time_range: all
      filters: []
      breakdown: campaign_channel
    gold_sql: 'SELECT ep #>> ''{campaign,channel}'' AS campaign_channel, coalesce(sum(revenue)
      FILTER (WHERE event_name=''purchase''),0)::numeric AS revenue FROM analytics.event_activity
      WHERE source_id=''event_benchmark'' GROUP BY 1 ORDER BY 1'
