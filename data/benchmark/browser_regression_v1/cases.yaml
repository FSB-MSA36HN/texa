- id: browser_single_cosmetics_revenue
  split: dev
  fixture_world: base
  family: browser_full_table_metric
  source_id: cosmetics_shop
  language: vi
  question: Tổng doanh thu Cosmetics Shop trên toàn bộ dữ liệu là bao nhiêu?
  gold_sql: SELECT coalesce(sum(revenue) FILTER(WHERE event_name IN ('purchase','order_purchased')),0) AS revenue FROM analytics.event_activity WHERE source_id='cosmetics_shop'
  expected_result: {columns: [revenue], rows: [[420.00]]}
