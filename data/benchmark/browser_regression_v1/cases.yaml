  gold_sql: SELECT ep->'campaign'->>'channel' AS campaign_channel, count(DISTINCT user_id) FILTER(WHERE event_name IN ('purchase','order_purchased')) AS buyers FROM analytics.event_activity WHERE source_id='cosmetics_shop' AND event_name='purchase' GROUP BY 1
