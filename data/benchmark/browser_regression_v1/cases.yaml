- id: browser_single_cosmetics_monthly_revenue
  split: dev
  fixture_world: base
  family: browser_full_table_grouping
  source_id: cosmetics_shop
  language: vi
  question: Doanh thu Cosmetics Shop theo tháng trên toàn bộ dữ liệu?
  gold_sql: SELECT date_trunc('month',event_date)::date AS event_month, coalesce(sum(revenue) FILTER(WHERE event_name IN ('purchase','order_purchased')),0) AS revenue FROM analytics.event_activity WHERE source_id='cosmetics_shop' AND event_name='purchase' GROUP BY 1
  expected_result: {columns: [event_month, revenue], rows: [['2025-01-01', 185.00], ['2025-02-01', 205.00], ['2025-03-01', 30.00]]}
