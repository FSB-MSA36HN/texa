- id: rv2dlg_test_return_ordinal
  split: test
  family: return_to_ordinal_result
  phenomenon: return_ordinal
  cluster_id: return_ordinal_test
  source_id: olist_marketplace
  language: en
  dependency_distance: 1
  turns:
  - question: Show the top two Olist product categories by purchased-item revenue.
    action: answer
    state:
      metric: revenue
      time_range: all
      filters: []
      breakdown: item_category
    gold_sql: SELECT item_category, sum(revenue)::numeric AS revenue FROM analytics.event_activity WHERE source_id='olist_marketplace'
      AND event_name='order_purchased' GROUP BY item_category ORDER BY revenue DESC LIMIT 2
    expected_result:
      columns:
      - item_category
      - revenue
      rows:
      - - skin
        - 50
      - - hair
        - 20
    ask_fields:
    - time_range
    oracle_intent:
      source_id: olist_marketplace
      time_range: all
    oracle_answers:
      context:source:
      - olist_marketplace
      time_range:
      - all
  - question: How much revenue did the second category have?
    action: answer
    scoring_kind: discussion_answer
    state:
      metric: revenue
      time_range: all
      filters:
      - item_category: hair
      breakdown: null
    gold_sql: SELECT sum(revenue)::numeric AS revenue FROM analytics.event_activity WHERE source_id='olist_marketplace' AND
      event_name='order_purchased' AND item_category='hair'
    expected_result:
      columns:
      - revenue
      rows:
      - - 20
    referenced_turn: 1
    ask_fields:
    - time_range
    oracle_intent:
      source_id: olist_marketplace
      time_range: all
    oracle_answers:
      context:source:
      - olist_marketplace
      time_range:
      - all
