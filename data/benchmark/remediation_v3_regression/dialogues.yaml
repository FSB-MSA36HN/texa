- id: rv2dlg_dev_social_noise
  split: dev
  family: social_noise_new_query
  phenomenon: social_noise
  cluster_id: social_noise_dev
  source_id: cosmetics_shop
  language: en
  dependency_distance: 0
  turns:
  - question: How many purchase events are in the cosmetics shop?
    action: answer
    state:
      metric: purchases
      time_range: all
      filters: []
      breakdown: null
    gold_sql: SELECT count(*)::bigint AS purchases FROM analytics.event_activity WHERE source_id='cosmetics_shop' AND event_name='purchase'
    expected_result:
      columns:
      - purchases
      rows:
      - - 4
    ask_fields:
    - time_range
    oracle_intent:
      source_id: cosmetics_shop
      time_range: all
    oracle_answers:
      context:source:
      - cosmetics_shop
      time_range:
      - all
  - question: Thanks, that answers my question.
    action: conversation
  - question: And how many distinct users are in that same shop?
    action: answer
    state:
      metric: users
      time_range: all
      filters: []
      breakdown: null
    gold_sql: SELECT count(DISTINCT user_id)::bigint AS users FROM analytics.event_activity WHERE source_id='cosmetics_shop'
    expected_result:
      columns:
      - users
      rows:
      - - 5
    ask_fields:
    - time_range
    oracle_intent:
      source_id: cosmetics_shop
      time_range: all
    oracle_answers:
      context:source:
      - cosmetics_shop
      time_range:
      - all
