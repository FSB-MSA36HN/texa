name: Texa Research Benchmark v4 candidate (real data, independent oracle)
dataset_type: research_candidate
version: 4
status: agent_authored_unsealed_pending_human_review
engine: PostgreSQL 16+
sources:
- cosmetics_shop
- olist_marketplace
metrics:
- events
- users
- sessions
- viewers
- purchases
- buyers
- revenue
- buyer_conversion_rate
suites:
- single
single_turn_suite: cases.yaml
fixture_worlds:
  real:
    file: worlds/real.sql
    generated_by: export_world.py
gold_oracle:
  engine: duckdb
  module: backend/eval/oracle_csv.py
  glossary: GLOSSARY.md
  independence: reads raw CSV only; shares no code or definitions file with the ETL mart, the catalog or research_v3
raw_data_sha256:
  cosmetics_shop/2019-Dec.csv: 75857d9272c5b41782c5a5787d8ec8845d23f1775de30d29cef71fc010db4180
  cosmetics_shop/2020-Jan.csv: a02df977599dfddbce24866c91c55947529181abe4b34b2c585a8c23ff663f33
  olist_marketplace/olist_customers_dataset.csv: 983a422239e1712ded753b3bf9ecf47dc73f144d306029dcfa99e70a226883d2
  olist_marketplace/olist_order_items_dataset.csv: 0bc4d068c4fe38cbb01bd90e8746e3c613fe7b4baef75fab7b0e329701c3e279
  olist_marketplace/olist_order_payments_dataset.csv: 4f713964f2815dbbaa40b9488268c55aac3627bfce5aa96cf58d1f3616de3cc0
  olist_marketplace/olist_order_reviews_dataset.csv: 012b61c7593e34f51fa614efdf802b9c7056ce6aae5307ddb93236e7cfc797d7
  olist_marketplace/olist_orders_dataset.csv: 8df58ef3d2d7e9944010f7beecd9b75367f5588ec6e3c91cec19ae3345ef9ecf
  olist_marketplace/olist_products_dataset.csv: 3e6569628a17fbc75fd206ee357b59e20364b9afa90f5b6cd5b4d624c58aa9cc
  olist_marketplace/olist_sellers_dataset.csv: 1f643d2b950373b85735e7794b20986f528d7a000432e7c6f9bcbb44d0846a0e
  olist_marketplace/product_category_name_translation.csv: a81f0d1f27b27e7293f761bc79e3ce8f348ee39c4b3ed3e49bde38f478586278
split_policy: 'Family-disjoint: a family is (source, metric, shape); each family is entirely dev or test. Dev {''basic'': 20, ''compositional'': 50, ''semantic'': 30}, test {''basic'': 40, ''compositional'':
  100, ''semantic'': 60}, evenly split over the two sources.'
quality_gates:
- no empty or all-zero gold
- every gold table unique
- gold differs from two plausible wrong readings
- gold SQL on the ETL warehouse equals the raw-CSV oracle (validate_research_v4.py)
statistics:
  cases: 300
  dev: 100
  test: 200
  strata_test:
    basic: 40
    compositional: 100
    semantic: 60
  strata_dev:
    basic: 20
    compositional: 50
    semantic: 30
  sources_test:
    cosmetics_shop: 100
    olist_marketplace: 100
  dev_families: 32
  test_families: 64
  family_overlap: 0
  distinct_result_tables: 300
  single_row_results: 127
  empty_or_zero_results: 0
  rejected_candidates:
    duplicate: 141
    not_discriminating: 18
  infeasible_families:
  - cosmetics_shop:events:single_day
  - olist_marketplace:buyer_conversion_rate:category_filter
human_review: pending two independent reviewers (see AUDIT.csv and REVIEW_GUIDE.md)
sealed: false
test_labels_exposed_to_author: true
limitations: Questions are still template-generated (3 phrasings per shape). Real data removes the tiny-fixture and circular-oracle weaknesses of v3 but does not replace human review. Cosmetics Shop is
  small (6,200 events). Single-question suite only; clarification, conversation and unsupported suites remain v3.
