- id: msv1_source_memory
  split: dev
  family: source_switch
  dependency_distance: 1
  turns:
  - question: How many users in cosmetics_shop on 2019-12-01?
    action: answer
    state:
      metric: users
      source_ids:
      - cosmetics_shop
      time_range: '2019-12-01'
      filters: []
      breakdown: null
    gold_sql: SELECT count(DISTINCT user_id)::bigint AS users FROM analytics.event_activity
      WHERE source_id='cosmetics_shop' AND event_date='2019-12-01'
    expected_result:
      columns:
      - users
      rows:
      - - 2
  - question: And for Olist on that same day?
    action: answer
    state:
      metric: users
      source_ids:
      - olist_marketplace
      time_range: '2019-12-01'
      filters: []
      breakdown: null
    gold_sql: SELECT count(DISTINCT user_id)::bigint AS users FROM analytics.event_activity
      WHERE source_id='olist_marketplace' AND event_date='2019-12-01'
    expected_result:
      columns:
      - users
      rows:
      - - 1
    referenced_turn: 1
