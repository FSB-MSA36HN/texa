- id: msv1_missing_period
  split: dev
  family: missing_period
  dependency_distance: 0
  turns:
  - question: Show users in cosmetics_shop.
    action: clarify
    ask_fields:
    - time_range
  - question: Use all available dates in cosmetics_shop.
    action: clarification_answer
    state:
      metric: users
      source_ids:
      - cosmetics_shop
      time_range: all
      filters: []
      breakdown: null
    gold_sql: SELECT count(DISTINCT user_id)::bigint AS users FROM analytics.event_activity
      WHERE source_id='cosmetics_shop'
    expected_result:
      columns:
      - users
      rows:
      - - 5
    oracle_answers:
      time_range:
      - all
