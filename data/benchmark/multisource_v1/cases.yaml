- id: msv1_cosmetics_shop_users_by_category
  split: dev
  family: top_users_category
  question: Show the top 3 non-null product categories by distinct recorded users
    in cosmetics shop for December 1–4, 2019.
  gold_sql: SELECT item_category, count(DISTINCT user_id)::bigint AS users FROM analytics.event_activity
    WHERE source_id='cosmetics_shop' AND event_date BETWEEN '2019-12-01' AND '2019-12-04'
    AND item_category IS NOT NULL GROUP BY 1 ORDER BY 2 DESC,1 LIMIT 3
  expected_result:
    columns:
    - item_category
    - users
    rows:
    - - hair
      - 2
    - - makeup
      - 2
    - - skin
      - 2
  ordered: true
  in_scope: true
  intent: top_users_category
  difficulty: easy
  tags:
  - synthetic
  - cosmetics_shop
  - diagnostic
