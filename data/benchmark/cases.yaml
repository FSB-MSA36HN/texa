- id: dev_events_total
  split: dev
  family: event_totals
  question: Có bao nhiêu sự kiện trong toàn bộ dữ liệu?
  gold_sql: SELECT count(*)::bigint AS events FROM analytics.event_activity WHERE
    source_id='event_benchmark'
  expected_result:
    columns:
    - events
    rows:
    - - 12
  in_scope: true
- id: dev_users_total
  split: dev
  family: event_totals
  question: Có bao nhiêu người dùng khác nhau trong toàn bộ dữ liệu?
  gold_sql: SELECT count(DISTINCT user_id)::bigint AS users FROM analytics.event_activity
    WHERE source_id='event_benchmark'
  expected_result:
    columns:
    - users
    rows:
    - - 5
  in_scope: true
- id: dev_sessions_total
  split: dev
  family: event_totals
  question: Tổng cộng có bao nhiêu phiên trong toàn bộ dữ liệu?
  gold_sql: SELECT count(DISTINCT session_id)::bigint AS sessions FROM analytics.event_activity
    WHERE source_id='event_benchmark'
  expected_result:
    columns:
    - sessions
    rows:
    - - 6
  in_scope: true
- id: dev_purchases_total
  split: dev
  family: event_totals
  question: Có bao nhiêu lượt mua hàng trong toàn bộ dữ liệu?
  gold_sql: SELECT count(*)::bigint AS purchases FROM analytics.event_activity WHERE
    source_id='event_benchmark' AND event_name='purchase'
  expected_result:
    columns:
    - purchases
    rows:
    - - 4
  in_scope: true
- id: dev_buyers_total
  split: dev
  family: event_totals
  question: Có bao nhiêu khách đã mua trong toàn bộ dữ liệu?
  gold_sql: SELECT count(DISTINCT user_id)::bigint AS buyers FROM analytics.event_activity
    WHERE source_id='event_benchmark' AND event_name='purchase'
  expected_result:
    columns:
    - buyers
    rows:
    - - 3
  in_scope: true
- id: dev_revenue_total
  split: dev
  family: event_totals
  question: Doanh thu từ mua hàng trong toàn bộ dữ liệu là bao nhiêu?
  gold_sql: SELECT sum(revenue)::numeric AS revenue FROM analytics.event_activity
    WHERE source_id='event_benchmark' AND event_name='purchase'
  expected_result:
    columns:
    - revenue
    rows:
    - - 135
  in_scope: true
- id: dev_buyer_user_ratio
  split: dev
  family: event_totals
  question: Tỷ lệ người mua trên tổng số người dùng trong toàn bộ dữ liệu là bao nhiêu?
  gold_sql: SELECT count(DISTINCT user_id) FILTER (WHERE event_name='purchase')::numeric
    / nullif(count(DISTINCT user_id),0) AS buyer_conversion_rate FROM analytics.event_activity
    WHERE source_id='event_benchmark'
  expected_result:
    columns:
    - buyer_conversion_rate
    rows:
    - - 0.6
  in_scope: true
- id: dev_device_event_counts
  split: dev
  family: nested_scalar
  question: Đếm sự kiện theo loại thiết bị trong toàn bộ dữ liệu.
  gold_sql: 'SELECT ep #>> ''{device,type}'' AS device_type, count(*)::bigint AS events
    FROM analytics.event_activity WHERE source_id=''event_benchmark'' GROUP BY 1 ORDER
    BY 1'
  expected_result:
    columns:
    - device_type
    - events
    rows:
    - - desktop
      - 3
    - - mobile
      - 6
    - - tablet
      - 3
  in_scope: true
- id: dev_paid_events
  split: dev
  family: nested_scalar
  question: Có bao nhiêu sự kiện thuộc kênh paid trong toàn bộ dữ liệu?
  gold_sql: 'SELECT count(*)::bigint AS events FROM analytics.event_activity WHERE
    source_id=''event_benchmark'' AND ep #>> ''{campaign,channel}''=''paid'''
  expected_result:
    columns:
    - events
    rows:
    - - 6
  in_scope: true
- id: dev_category_users
  split: dev
  family: nested_scalar
  question: Có bao nhiêu người xem mỗi danh mục sản phẩm trong toàn bộ dữ liệu?
  gold_sql: SELECT item_category, count(DISTINCT user_id)::bigint AS viewers FROM
    analytics.event_activity WHERE source_id='event_benchmark' AND event_name='view'
    GROUP BY 1 ORDER BY 1
  expected_result:
    columns:
    - item_category
    - viewers
    rows:
    - - books
      - 2
    - - shoes
      - 2
    - - toys
      - 1
  in_scope: true
- id: dev_paid_buyers
  split: dev
  family: nested_scalar
  question: Có bao nhiêu người đã mua qua kênh paid trong toàn bộ dữ liệu?
  gold_sql: 'SELECT count(DISTINCT user_id)::bigint AS buyers FROM analytics.event_activity
    WHERE source_id=''event_benchmark'' AND event_name=''purchase'' AND ep #>> ''{campaign,channel}''=''paid'''
  expected_result:
    columns:
    - buyers
    rows:
    - - 2
  in_scope: true
- id: dev_checkout_sum
  split: dev
  family: nested_scalar
  question: Tổng giá trị checkout ghi trong payload trên toàn bộ dữ liệu là bao nhiêu?
  gold_sql: 'SELECT sum((ep #>> ''{checkout,amount}'')::numeric) AS checkout_amount
    FROM analytics.event_activity WHERE source_id=''event_benchmark'' AND event_name=''purchase'''
  expected_result:
    columns:
    - checkout_amount
    rows:
    - - 135
  in_scope: false
