- id: test_channel_buyers
  split: test
  family: nested_grouping
  question: Số người mua riêng biệt theo campaign channel trên toàn bộ dữ liệu.
  gold_sql: 'SELECT ep #>> ''{campaign,channel}'' AS campaign_channel, count(DISTINCT
    user_id) FILTER (WHERE event_name=''purchase'')::bigint AS buyers FROM analytics.event_activity
    WHERE source_id=''event_benchmark'' GROUP BY 1 ORDER BY 1'
  expected_result:
    columns:
    - campaign_channel
    - buyers
    rows:
    - - email
      - 1
    - - organic
      - 1
    - - paid
      - 2
    - - referral
      - 0
  in_scope: true
